<div class="slider-header">
  <span class="name">{{ slider().name }} </span>
  <span class="value">(&hairsp;{{ slider().value }}&hairsp;)</span>
</div>
<input
  #sliderInput
  type="range"
  [min]="slider().range.min"
  [max]="slider().range.max"
  [value]="slider().value"
  [step]="slider().step"
/>
