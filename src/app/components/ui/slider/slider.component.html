<div class="slider-header">
  <span class="name">{{ slider().name }} </span>
  <span class="value">(&hairsp;{{ value() }}&hairsp;)</span>
</div>
<input
  #sliderInput
  type="range"
  [min]="slider().range.min"
  [max]="slider().range.max"
  [value]="value()"
  [step]="slider().step"
/>
